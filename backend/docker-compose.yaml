services:
  turf-backend:
    build: .
    container_name: turf-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - turf-mongo
      - turf-redis
      - turf-chroma
    volumes:
      - .:/app
      # Cache for Chroma's default embedding model (downloaded on first use)
      - chroma_model_cache:/root/.cache/chroma
    command: gunicorn --reload --reload-engine=poll --workers 2 --threads 4 --bind 0.0.0.0:8000 --timeout 60 --access-logfile - --error-logfile - --log-level debug app:flask_app

  turf-mongo:
    hostname: turf-mongo
    image: mongo:6.0
    restart: always
    container_name: turf-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=root
    #   - MONGO_INITDB_ROOT_PASSWORD=secret
    # command: ["mongod", "--bind_ip_all"]

  turf-redis:
    image: redis:7
    container_name: turf-redis
    ports:
    - "6379:6379"
    # no ports

  # Vector DB for the RAG knowledge base. Derived data: rebuild with scripts/build_kb.py.
  # Keep the image tag in sync with the chromadb version in requirements.txt.
  turf-chroma:
    image: chromadb/chroma:1.5.9
    container_name: turf-chroma
    restart: always
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8001:8000"   # host 8001 -> container 8000 (host 8000 is the backend)
    volumes:
      - chroma_data:/data

  jenkins:
    image: jenkins/jenkins:lts
    container_name: turf-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  chroma_model_cache:
  jenkins_home:
